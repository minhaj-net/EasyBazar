<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <circle cx="60" cy="60" r="58" fill="#F0FBF8" stroke="#2D9A6A" stroke-width="2"/>
  <!-- Glass body -->
  <path d="M38 35 L44 88 Q60 94 76 88 L82 35 Z" fill="url(#drinkGrad)"/>
  <!-- Liquid -->
  <path d="M40 52 L44 88 Q60 94 76 88 L80 52 Z" fill="#27AE7A" opacity="0.8"/>
  <!-- Ice cubes -->
  <rect x="50" y="58" width="12" height="12" rx="2" fill="white" opacity="0.5" transform="rotate(10 56 64)"/>
  <rect x="60" y="62" width="10" height="10" rx="2" fill="white" opacity="0.4" transform="rotate(-8 65 67)"/>
  <!-- Straw -->
  <rect x="70" y="28" width="4" height="54" rx="2" fill="#E74C3C" transform="rotate(8 72 55)"/>
  <rect x="70.5" y="28.5" width="3" height="53" rx="1.5" fill="#FF6B6B" opacity="0.5" transform="rotate(8 72 55)"/>
  <!-- Bubbles -->
  <circle cx="50" cy="68" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="58" cy="72" r="2" fill="white" opacity="0.4"/>
  <circle cx="65" cy="65" r="1.5" fill="white" opacity="0.45"/>
  <!-- Glass shine -->
  <path d="M42 38 L43 52" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Glass rim -->
  <ellipse cx="60" cy="35" rx="22" ry="5" fill="none" stroke="#B0D8CC" stroke-width="1.5"/>
  <defs>
    <linearGradient id="drinkGrad" x1="38" y1="35" x2="82" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F8F5"/>
      <stop offset="100%" stop-color="#B0D8CC"/>
    </linearGradient>
  </defs>
</svg>
